name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests marked `live` are deselected in pyproject.toml: no model runs in CI.
      - run: uv run pytest

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Node 22 ships npm 10, but package-lock.json is written by npm 11 locally.
      # npm 10 resolves optional peer dependencies differently and rejects the lock file.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
